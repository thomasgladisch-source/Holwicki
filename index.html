<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Holwicki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Holwicki – Geschichten & Geschichte rund um Holweide." />

  <style>
    :root{
      /* deine bisherigen Farben */
      --bg:#07130c;
      --panel:rgba(120,180,150,.12);
      --panel2:rgba(120,180,150,.07);
      --text:#eef7f1;
      --muted:#b7d3c4;
      --link:#8fd3a8;
      --border:rgba(160,210,185,.25);
      --radius:18px;
      --max:980px;

      /* Split-Screen Farben aus dem Screenshot */
      --split-left:#f3eeee;
      --split-right:#0b553a;
      --split-line:rgba(255,255,255,.22);
      --split-brand:#0b553a;
      --split-menu:rgba(255,255,255,.90);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 600px at 15% 0%, #0f3a28, transparent 60%),
        radial-gradient(900px 600px at 85% 10%, #143d2b, transparent 55%),
        var(--bg);
      color:var(--text);
    }

    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}

    .wrap{max-width:var(--max); margin:0 auto; padding:18px}

    /* Header (deine Topbar) */
    .topbar{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      background:rgba(7,19,12,.75);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
      padding:12px 18px;
      z-index:10;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.2px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:99px;
      background:var(--link);
      box-shadow:0 0 0 4px rgba(143,211,168,.18);
    }

    .nav{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .nav a{color:var(--muted)}
    .nav a:hover{color:var(--text); text-decoration:none}

    /* =========================
       SPLIT-SCREEN STARTBLOCK
       ========================= */
    .split{
      min-height: 78svh;
      display:grid;
      grid-template-columns: 1fr 1fr;
      margin:18px;
      border-radius: 22px;
      overflow:hidden;
      border:1px solid var(--border);
    }

    .split-left{
      background: var(--split-left);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:56px 24px;
    }

    .split-brandbox{
      width:min(520px, 100%);
      color:#0b0f19;
    }

    .split-title{
      margin:0 0 6px 0;
      font-size: clamp(44px, 5vw, 64px);
      line-height:1.05;
      color:var(--split-brand);
      font-weight:800;
      letter-spacing:.2px;
    }

    .split-sub{
      margin:0 0 28px 0;
      font-size: clamp(20px, 2.2vw, 30px);
      color:var(--split-brand);
      font-weight:700;
      opacity:.95;
    }

    .split-crest{
      margin-top:10px;
      width:min(420px, 100%);
      height:auto;
      display:block;
      filter: grayscale(100%) contrast(1.05);
    }

    .split-right{
      background: var(--split-right);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 18px;
    }

    .split-menu{
      width:min(520px, 92%);
      border-top:1px solid var(--split-line);
    }

    .split-menu a{
      display:block;
      text-decoration:none;
      color:var(--split-menu);
      font-weight:600;
      letter-spacing:.2px;
      text-align:center;
      padding:28px 10px;
      border-top:1px solid var(--split-line);
      transition: transform .15s ease, opacity .15s ease;
    }

    .split-menu a:first-child{border-top:none}
    .split-menu a:last-child{border-bottom:1px solid var(--split-line)}

    .split-menu a:hover{
      transform: translateY(-1px);
      opacity:1;
      text-decoration:none;
    }

    @media (max-width: 900px){
      .split{
        grid-template-columns:1fr;
        min-height:auto;
      }
      .split-left{
        padding:40px 20px 28px;
      }
      .split-brandbox{
        text-align:center;
      }
      .split-crest{
        margin-left:auto;
        margin-right:auto;
      }
    }

    /* Hero / Cards */
    .hero{
      margin-top:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, var(--panel), var(--panel2));
      border-radius:var(--radius);
      padding:22px;
    }
